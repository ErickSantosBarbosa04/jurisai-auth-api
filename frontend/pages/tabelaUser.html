<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | JurisAI Admin</title>
    <link rel="stylesheet" href="../css/dashboardStyle.css">
    <link rel="stylesheet" href="../css/dashboardADM.css?v=1.1">
    <link rel="stylesheet" href="../css/adminBotoes.css">
    <link rel="icon" href="../assets/—Pngtree—elegant golden business logo capital_20563813.png" type="image/png">
</head>
<body>
    
    <nav class="navbar">
        <div class="brand" style="color: var(--primary-gold);">JurisAI <span class="admin-badge">ADMIN</span></div>
        <div class="nav-actions">
            <a href="dashboardADM.html" style="color: white; text-decoration: none; font-weight: 600; font-size: 14px; margin-right: 15px; display: flex; align-items: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Voltar ao Painel
            </a>
        </div>
    </nav>

    <main class="page-shell">
        
        <header class="page-header">
            <div>
                <p class="eyebrow">Administração > Usuários</p>
                <h1>Controle de Acessos</h1>
            </div>
            
            <div style="display: flex; gap: 12px; align-items: center; margin-top: 15px; flex-wrap: wrap;">
                <input type="text" id="userSearch" placeholder="Buscar por nome ou e-mail..." class="auth-input" style="max-width: 350px; flex: 1; margin: 0;">
                
                <select id="userSort" class="auth-input" style="max-width: 180px; margin: 0; cursor: pointer;">
                    <option value="recente">Mais Recentes</option>
                    <option value="az">Ordem: A - Z</option>
                    <option value="za">Ordem: Z - A</option>
                </select>
            </div>
        </header>

        <section class="panel">
            
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Status</th>
                            <th>Perfil</th>
                            <th>Especialidade</th>
                            <th>Ações Rápidas</th>
                        </tr>
                    </thead>
                    <tbody id="fullUsersTable">
                        </tbody>
                </table>
            </div>
            
            <div id="paginationContainer" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid var(--border); background: var(--bg-panel); border-radius: 0 0 8px 8px;">
                <span id="paginationInfo" style="font-size: 13px; color: var(--text-muted);">Mostrando 0 de 0 usuários</span>
                
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button id="btnPrevPage" class="btn-pagination" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        Anterior
                    </button>
                    
                    <span id="currentPageDisplay" style="font-size: 14px; font-weight: 700; padding: 6px 14px; background: var(--primary-gold); color: #000; border-radius: 6px; box-shadow: 0 2px 4px rgba(212, 175, 55, 0.3);">1</span>
                    
                    <button id="btnNextPage" class="btn-pagination" disabled>
                        Próxima
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>

        </section>
    </main>

    <div id="logsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
        <div style="background: #1e1e24; border: 1px solid #3a3a42; padding: 24px; border-radius: 12px; width: 90%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-family: 'Inter', sans-serif;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a42; padding-bottom: 14px; margin-bottom: 20px;">
                <h2 id="logsModalTitle" style="font-size: 18px; margin: 0; color: #d4af37; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 10h6"></path><path d="M9 18h6"></path></svg>
                    Histórico do Usuário
                </h2>
                <button onclick="fecharModalLogs()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #a3a3a3;">&times;</button>
            </div>
            
            <div style="max-height: 320px; overflow-y: auto;">
                <style>
                    #logsList li { 
                        color: #ffffff !important; 
                        padding: 10px 0; 
                        border-bottom: 1px solid #333;
                        font-size: 13px;
                    }
                    #logsList li span.log-time {
                        color: #d4af37 !important;
                        font-weight: 600;
                        margin-right: 8px;
                    }
                </style>
                <ul id="logsList" style="list-style: none; padding: 0; margin: 0;">
                    </ul>
            </div>
        </div>
    </div>

    <div id="lgpdModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
        <div style="background: #1e1e24; border: 1px solid #3a3a42; padding: 24px; border-radius: 8px; width: 90%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a42; padding-bottom: 12px; margin-bottom: 15px;">
                <h2 style="font-size: 18px; margin: 0; color: #d4af37; display: flex; align-items: center; gap: 8px;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Ficha de Conformidade LGPD
                </h2>
                <button onclick="fecharModalLGPD()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #a3a3a3;">&times;</button>
            </div>
            
            <div style="max-height: 420px; overflow-y: auto;">
                <pre id="lgpdContent" style="background: #000000; color: #ffffff; padding: 20px; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', monospace; font-size: 12px; border: 1px solid #333; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);"></pre>
            </div>
        </div>
    </div>

    <script src="../js/authGuard.js"></script>
    <script src="../js/tabelaUser.js?v=1.2"></script>
</body>
</html>
